{% extends "base.html" %}
{% block content %}
{% load static %}
{% block title %} Note Detail {% endblock title %}

<h1>Note Details</h1>

<div class="card">

    <div class="card-content">
        <span class="pinned">📌</span>
        <h2>{{ object.title }}</h2>
        <p>{{ object.content }}</p>

        <p><small>Created on: {{ object.created_at }}</small></p>
        <p><small>file:{{ object.file }}</small></p>
    </div>

    <div class="card-sidebar">
        <a href="{% url 'edit' object.pk %}" class="btn btn-edit">Edit</a>
        <a href="{% url 'delete' object.pk %}" class="btn btn-delete">Delete</a>
        <a href="{% url 'list' %}" class="btn btn-view">Back</a>
    </div>

</div>

{% endblock content %}
