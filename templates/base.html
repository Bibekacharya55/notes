{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>{% block title %}{% endblock title %}</title>

<style>
    body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f8f9fa;
    }

    .navbar {
        display: flex;
        justify-content: space-between;
        padding: 16px 40px;
        background: #fff;
        border-bottom: 1px solid #ddd;
    }

    .navbar a {
        text-decoration: none;
        margin-left: 20px;
        color: #000;
        font-size: 16px;
    }

    .container {
        width: 100%;
        margin: 30px auto;
    }

    .btn {
        background: #1a73e8;
        border: none;
        padding: 10px 18px;
        color: #fff;
        border-radius: 5px;
        cursor: pointer;
        font-size: 15px;
        text-decoration: none;
    }

    .btn-danger {
        background: red;
    }

    .card {
        background: #fff;
        padding: 20px;
        border-radius: 8px;
        margin-bottom: 20px;
        border: 1px solid #e0e0e0;
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    input, textarea {
        width: 100%;
        padding: 12px;
        margin-top: 10px;
        border: 1px solid #ccc;
        border-radius: 8px;
    }

    .pinned {
        float: right;
        font-size: 20px;
        color: gray;
    }

    /* ---- FIXED SIDEBAR BUTTON STYLES ---- */

    .card-sidebar {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .card-sidebar .btn {
        display: inline-block;
        padding: 8px 16px;
        text-align: center;
        border-radius: 6px;
        font-weight: 600;
        text-decoration: none;
        color: #fff;
    }

    .btn-view {
        background-color: #3498db;
    }

    .btn-edit {
        background-color: #f1c40f;
        color: #000;
    }

    .btn-delete {
        background-color: #e74c3c;
    }

    .btn:hover {
        opacity: 0.85;
    }
.card {
    background: #fff;
    padding: 25px;
    border-radius: 10px;
    margin-bottom: 25px;
    border: 1px solid #e0e0e0;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 20px;     /* More space between text and buttons */
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
}

.card h2 {
    font-size: 22px;
    margin-bottom: 10px;
}

.card p {
    font-size: 16px;
    line-height: 1.6;  /* Better line spacing */
    margin-bottom: 8px;
}

.card small {
    font-size: 14px;
    color: gray;
}

.card-sidebar {
    display: flex;
    flex-direction: column;
    gap: 12px;     /* More spacing between buttons */
}
.container {
    width: 80%;
    margin: 30px auto;
}

</style>
</head>

<body>

<div class="navbar">
    <a href="notes.html">Notes</a>
    <div>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
    </div>
</div>

<div class="container">
    {% block content %}
    {% endblock content %}
</div>

</body>
</html>
